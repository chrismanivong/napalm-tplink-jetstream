[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "napalm-tplink-jetstream"
version = "0.1.0"
description = "NAPALM driver for TP-Link Jetstream managed switches"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.8"
authors = [
    { name = "Christian Manivong" },
]
classifiers = [
    "Topic :: Utilities",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = [
    "napalm>=4.0.0",
    "netmiko>=4.0.0",
    "netaddr",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
]

[project.entry-points."napalm.drivers"]
tplink_jetstream = "napalm_tplink_jetstream:TPLinkJetstreamDriver"

[project.urls]
Repository = "https://github.com/napalm-automation-community/napalm-tplink-jetstream"

[tool.setuptools.packages.find]
where = ["."]
include = ["napalm_tplink_jetstream*"]

[tool.ruff]
line-length = 100
target-version = "py38"
